<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula formulario</title>
</head>
<body>
    <h1>Meu primeiro formulário</h1>
    <form action="\pagina-para-o-formulario" method="post">
        <div>
            <label for="nome">Nome</label>
            <input type="text" id="fnome" name="nome">
        </div>
        <div>
            <label for="senha">Senha</label>
            <input type="password" id="fsenha" name="senha">
        </div>
        <div>
            <input type="checkbox">
            <label for="check">Concordo com os termos de licença;</label>
        </div>
        <div>
            <label for="data">Marque um encontro: dia e hora</label>
            <input type="date">
            <input type="time">
        </div>
        <div>
            <label for="cantada"></label>
        </div>




    </form>
</body>
</html>
